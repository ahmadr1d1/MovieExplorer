version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2024.04.1
    working_directory: ~/project

    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "build.gradle.kts" }}
            - gradle-v1-

      - run:
          name: Grant execute permission for Gradle wrapper
          command: chmod +x ./gradlew

      - run:
          name: Download Dependencies
          command: ./gradlew dependencies || true

      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-v1-{{ checksum "build.gradle.kts" }}

      - run:
          name: Run Build
          command: ./gradlew build --stacktrace

      - store_artifacts:
          path: app/build/reports
          destination: reports

      - run:
          name: Run Lint & Unit Tests
          command: ./gradlew lint test --stacktrace

      - store_test_results:
          path: app/build/test-results

      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: apk

workflows:
  build_and_test:
    jobs:
      - build
